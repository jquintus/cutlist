# Storage is also a cutlist project. Preserve the project-only keys that are
# intentionally absent from this inventory-focused form.
settings:
  content:
    merge: true

content:
  - name: storage
    label: Shop inventory
    type: file
    path: projects/storage.json
    format: json
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - name: notes
        label: Storage notes
        type: text
      - name: materials
        label: Stock
        type: block
        blockKey: kind
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        blocks:
          - name: sheet
            label: Sheet goods
            fields:
              - name: id
                type: uuid
                hidden: true
                options:
                  generate: false
              - name: name
                label: Material
                type: string
                required: true
                description: Examples include 1/2 in plywood and 3/4 in MDF.
              - name: thicknessIn
                label: Thickness (inches)
                type: number
                required: true
                options:
                  min: 0.001
              - name: note
                label: Notes
                type: text
              - name: sheets
                label: Pieces on hand
                type: object
                list:
                  min: 1
                  collapsible:
                    collapsed: true
                    summary: "{widthIn} x {lengthIn} in — qty {qty}"
                fields:
                  - name: id
                    type: uuid
                    hidden: true
                    options:
                      generate: false
                  - name: widthIn
                    label: Width (inches)
                    type: number
                    required: true
                    options:
                      min: 0.001
                  - name: lengthIn
                    label: Length (inches)
                    type: number
                    required: true
                    options:
                      min: 0.001
                  - name: qty
                    label: Quantity
                    type: number
                    required: true
                    default: 1
                    options:
                      min: 1
                  - name: note
                    label: Notes
                    type: text
          - name: board
            label: Boards
            fields:
              - name: id
                type: uuid
                hidden: true
                options:
                  generate: false
              - name: name
                label: Material
                type: string
                required: true
                description: Examples include cherry and construction pine.
              - name: thicknessIn
                label: Thickness (inches)
                type: number
                required: true
                options:
                  min: 0.001
              - name: widthIn
                label: Board width (inches)
                type: number
                required: true
                options:
                  min: 0.001
              - name: note
                label: Notes
                type: text
              - name: boards
                label: Boards on hand
                type: object
                list:
                  min: 1
                  collapsible:
                    collapsed: true
                    summary: "{lengthIn} in — qty {qty}"
                fields:
                  - name: id
                    type: uuid
                    hidden: true
                    options:
                      generate: false
                  - name: lengthIn
                    label: Length (inches)
                    type: number
                    required: true
                    options:
                      min: 0.001
                  - name: qty
                    label: Quantity
                    type: number
                    required: true
                    default: 1
                    options:
                      min: 1
                  - name: note
                    label: Notes
                    type: text
