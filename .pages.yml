# Storage is also a cutlist project. Preserve the project-only keys that are
# intentionally absent from this inventory-focused form.
settings:
  content:
    merge: true

content:
  - name: storage
    label: Shop inventory
    type: file
    path: projects/storage.json
    format: json
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - name: notes
        label: Storage notes
        type: text
      - name: materials
        label: Stock
        type: block
        blockKey: kind
        list:
          collapsible:
            collapsed: true
            summary: "{species}{name} {thicknessIn}{summarySeparator}{widthIn}"
        blocks:
          - name: sheet
            label: Sheet goods
            fields:
              - name: id
                type: uuid
                hidden: true
                options:
                  generate: false
              - name: summarySeparator
                type: string
                hidden: true
                default: ""
              - name: name
                label: Material
                type: string
                required: true
                description: Examples include 1/2 in plywood and 3/4 in MDF.
              - name: thicknessIn
                label: Thickness (inches)
                type: reference
                required: true
                options:
                  collection: stock_thicknesses
                  search: "label"
                  value: "{fields.label}"
                  label: "{fields.label}"
              - name: note
                label: Notes
                type: text
              - name: sheets
                label: Pieces on hand
                type: object
                list:
                  min: 1
                  collapsible:
                    collapsed: true
                    summary: "{widthIn} x {lengthIn} in — qty {qty}"
                fields:
                  - name: id
                    type: uuid
                    hidden: true
                    options:
                      generate: false
                  - name: widthIn
                    label: Width (inches)
                    type: number
                    required: true
                    options:
                      min: 0.001
                      step: 0.001
                  - name: lengthIn
                    label: Length (inches)
                    type: number
                    required: true
                    options:
                      min: 0.001
                      step: 0.001
                  - name: qty
                    label: Quantity
                    type: number
                    required: true
                    default: 1
                    options:
                      min: 1
                      step: 1
                  - name: note
                    label: Notes
                    type: text
          - name: board
            label: Boards
            fields:
              - name: id
                type: uuid
                hidden: true
                options:
                  generate: false
              - name: summarySeparator
                type: string
                hidden: true
                default: " x "
              - name: species
                label: Species
                type: reference
                required: true
                options:
                  collection: wood_species
                  search: "label"
                  value: "{fields.label}"
                  label: "{fields.label}"
              - name: thicknessIn
                label: Thickness (inches)
                type: reference
                required: true
                options:
                  collection: stock_thicknesses
                  search: "label"
                  value: "{fields.label}"
                  label: "{fields.label}"
              - name: widthIn
                label: Board width (inches)
                type: reference
                required: true
                options:
                  collection: board_widths
                  search: "label"
                  value: "{fields.label}"
                  label: "{fields.label}"
              - name: note
                label: Notes
                type: text
              - name: boards
                label: Boards on hand
                type: object
                list:
                  min: 1
                  collapsible:
                    collapsed: true
                    summary: "{lengthIn} in — qty {qty}"
                fields:
                  - name: id
                    type: uuid
                    hidden: true
                    options:
                      generate: false
                  - name: lengthIn
                    label: Length (inches)
                    type: number
                    required: true
                    options:
                      min: 0.001
                      step: 0.001
                  - name: qty
                    label: Quantity
                    type: number
                    required: true
                    default: 1
                    options:
                      min: 1
                      step: 1
                  - name: note
                    label: Notes
                    type: text
  - name: inventory_options
    label: Inventory options
    type: group
    items:
      - name: wood_species
        label: Wood species
        type: collection
        path: inventory/species
        format: json
        filename: "{label}.json"
        view:
          primary: label
          search: [label]
          sort: [label]
          default:
            sort: label
            order: asc
        fields:
          - name: label
            label: Species
            type: string
            required: true
      - name: stock_thicknesses
        label: Thicknesses
        type: collection
        path: inventory/thicknesses
        format: json
        filename: "{order}-{label}.json"
        view:
          primary: label
          fields: [inches, label]
          sort: [inches]
          default:
            sort: inches
            order: asc
        fields:
          - name: inches
            label: Inches
            type: number
            required: true
            options:
              min: 0.001
              step: 0.001
          - name: label
            label: Display
            type: string
            required: true
            pattern:
              regex: '^(?:[1-9]\d*(?:\.\d+)?|0\.\d*[1-9]\d*|[1-9]\d*/[1-9]\d*|[1-9]\d* [1-9]\d*/[1-9]\d*)"$'
              message: 'Use inches, such as 3", 1/4", or 3 1/2".'
          - name: order
            type: string
            hidden: true
            default: "99"
      - name: board_widths
        label: Board widths
        type: collection
        path: inventory/widths
        format: json
        filename: "{order}-{label}.json"
        view:
          primary: label
          fields: [inches, label]
          sort: [inches]
          default:
            sort: inches
            order: asc
        fields:
          - name: inches
            label: Inches
            type: number
            required: true
            options:
              min: 0.001
              step: 0.001
          - name: label
            label: Display
            type: string
            required: true
            pattern:
              regex: '^(?:[1-9]\d*(?:\.\d+)?|0\.\d*[1-9]\d*|[1-9]\d*/[1-9]\d*|[1-9]\d* [1-9]\d*/[1-9]\d*)"$'
              message: 'Use inches, such as 3", 1/4", or 3 1/2".'
          - name: order
            type: string
            hidden: true
            default: "99"
