<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>cutlist</title>
<link rel="stylesheet" href="styles/app.css" />
<link rel="stylesheet" href="styles/print.css" />
</head>
<body>
<header class="app-head">
  <div class="head-row">
    <h1 id="project-name">cutlist</h1>
    <div class="menu">
      <button id="btn-menu" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="menu-body">Menu</button>
      <div class="menu-body" id="menu-body" role="menu" hidden>
        <button id="btn-new" type="button" role="menuitem">New</button>
        <button id="btn-open" type="button" role="menuitem">Open&hellip;</button>
        <button id="btn-save" type="button" role="menuitem">Save</button>
        <button id="btn-save-as" type="button" role="menuitem">Save As&hellip;</button>
        <hr />
        <button id="btn-share" type="button" role="menuitem">Copy share link</button>
        <button id="btn-export" type="button" role="menuitem">Export JSON</button>
        <button id="btn-import" type="button" role="menuitem">Import JSON</button>
        <a id="link-upload" role="menuitem" href="https://github.com">Save to GitHub</a>
      </div>
    </div>
  </div>
  <p class="muted">Plywood in, a guillotine cut plan out. Check every measurement before you cut.</p>
  <p id="status" class="muted"></p>
  <input id="import-file" type="file" accept="application/json,.json" hidden />
</header>

<dialog id="dialog-open">
  <form method="dialog">
    <h2>Open a project</h2>
    <label for="project-picker">Projects in this build</label>
    <select id="project-picker"><option value="">Loading&hellip;</option></select>
    <p id="picker-status" class="muted"></p>
    <label for="local-picker">Saved in this browser</label>
    <select id="local-picker"><option value="">Nothing saved here yet</option></select>
    <p id="dialog-status" class="muted"></p>
    <div class="row"><button value="cancel">Close</button></div>
  </form>
</dialog>

<dialog id="dialog-save-as">
  <!-- Save is listed before Cancel on purpose: a form with method="dialog"
       submits via its first submit button when Enter is pressed in a text
       field, so this order is what makes Enter in the name field save rather
       than cancel. Do not reorder these. -->
  <form method="dialog">
    <h2>Save project as</h2>
    <label for="save-as-name">Project name</label>
    <input id="save-as-name" type="text" autocomplete="off" />
    <div class="row">
      <button value="save">Save</button>
      <button value="cancel">Cancel</button>
    </div>
  </form>
</dialog>

<main>
  <div id="results"></div>
  <div id="forms"></div>
</main>
