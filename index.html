<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>cutlist</title>
<link rel="stylesheet" href="styles/app.css" />
<link rel="stylesheet" href="styles/print.css" />
</head>
<body>
<header class="app-head">
  <h1>cutlist</h1>
  <p class="muted">Plywood in, a guillotine cut plan out. Check every measurement before you cut.</p>
  <div class="row app-controls">
    <div class="project-picker">
      <label for="project-picker">Saved projects</label>
      <select id="project-picker"><option value="">Loading...</option></select>
    </div>
    <div><button id="btn-share" type="button">Copy share link</button></div>
    <div><button id="btn-print" type="button" class="secondary">Print cut list</button></div>
  </div>
  <div class="row app-controls">
    <div><button id="btn-export" type="button" class="secondary">Export JSON</button></div>
    <div><button id="btn-import" type="button" class="secondary">Import JSON</button></div>
    <div><button id="btn-upload" type="button" class="secondary">Direct upload</button></div>
  </div>
  <p id="picker-status" class="muted"></p>
  <p id="status" class="muted"></p>
  <input id="import-file" type="file" accept="application/json,.json" hidden />
</header>

<main>
  <div id="results"></div>
  <div id="forms"></div>
</main>

<script type="module" src="src/ui/app.js"></script>
</body>
</html>
